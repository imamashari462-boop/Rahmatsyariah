name: Build RasyAI Sitamiang APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Extract project ZIP
        run: |
          unzip -o Debby_Barcode.zip -d extracted
          mkdir -p app/src/main/assets
          cp extracted/Debby.html app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RasyAI-Sitamiang-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
